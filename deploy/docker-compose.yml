# Runs the Vault sync server behind Caddy, which gets and renews a free HTTPS certificate automatically.
# Setup steps: docs/SYNC_AND_MOBILE.md. Run from this folder:  docker compose up -d --build
services:
  vault:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      VAULT_INVITE_CODE: ${VAULT_INVITE_CODE:?Set VAULT_INVITE_CODE in deploy/.env}
    volumes:
      - ./vault-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN:?Set VAULT_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - vault

volumes:
  caddy-data:
