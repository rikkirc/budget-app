[package]
name = "vault-web"
version = "0.2.0"
description = "Vault in the browser: vault-core compiled to WebAssembly for the web app (PWA)"
authors = ["rikkirc"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vault-core = { path = "../vault-core" }
wasm-bindgen = "=0.2.129"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
