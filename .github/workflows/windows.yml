# Builds the Windows desktop app installer on GitHub's machines, so no Rust or Node is needed on your PC.
# Download it from the run's "Artifacts" section and run it; it upgrades the installed Vault and keeps your data.
name: Windows app

# Runs whenever the code it builds changes, on any branch, and on demand
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "vault-core/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/windows.yml"

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app's own Rust tests, including its commands called through Tauri's IPC exactly as the screens call them
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: vault-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
