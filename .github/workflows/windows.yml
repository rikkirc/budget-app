# Builds the Windows desktop app installer on GitHub's machines, so no Rust or Node is needed on your PC.
# Download it from the run's "Artifacts" section and run it; it upgrades the installed Vault and keeps your data.
name: Windows app

# Retired: the web app (web.yml) replaces this app, so it no longer builds on every change.
# It can still be built by hand from Actions → Run workflow, should an old install ever need it.
on:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: vault-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
