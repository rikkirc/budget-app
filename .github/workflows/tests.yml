# Tests the shared business logic, the sync engine, and the Firebase security rules (on Firebase's local emulators)
name: Tests

# Runs whenever the code it tests changes, on any branch, and on demand
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vault-core/**"
      - "vault-web/**"
      - "src-tauri/**"
      - "scripts/**"
      - "firestore.rules"
      - "firebase.json"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vault-core/**"
      - "vault-web/**"
      - "src-tauri/**"
      - "scripts/**"
      - "firestore.rules"
      - "firebase.json"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes about 6 minutes; never let a stuck test hold a runner for hours
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vault-core
            src-tauri
            vault-web
      # Turns the WebAssembly build into the JavaScript the web app loads, and runs Rust tests inside WebAssembly.
      # Must match the wasm-bindgen version pinned in vault-web/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: cargo test --manifest-path vault-core/Cargo.toml
      # The same tests again, inside WebAssembly as the web app runs them
      - name: vault-core tests in WebAssembly
        run: cargo test --manifest-path vault-core/Cargo.toml --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      # The app's own Rust tests call its commands through Tauri's IPC exactly as the screens do. They run here on
      # Linux: on Windows, Tauri test programs can't start (they lack the app's Windows manifest).
      - name: Install the libraries Tauri needs on Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: npm run build:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # REQUIRE_WASM: the browser-versus-desktop tests must run here, never be skipped
      - run: npm test
        env:
          REQUIRE_WASM: "1"
      - run: npm run test:firebase
