# Tests the shared business logic, the sync engine, and the Firebase security rules (on Firebase's local emulators)
name: Tests

# Runs whenever the code it tests changes, on any branch, and on demand
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "vault-core/**"
      - "scripts/**"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "vault-core/**"
      - "scripts/**"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vault-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: cargo test --manifest-path vault-core/Cargo.toml
      - run: npm ci
      - run: npm test
      - run: npm run test:firebase
      - run: npm run build
