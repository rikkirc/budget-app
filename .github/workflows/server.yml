# Tests the shared business logic and the sync server, and checks the server's Docker image still builds
name: Core and sync server

# Runs whenever the code it builds changes, on any branch, and on demand
on:
  workflow_dispatch:
  push:
    paths:
      - "vault-core/**"
      - "server/**"
      - "deploy/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "vault-core/**"
      - "server/**"
      - "deploy/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vault-core
            server
      - run: cargo test --manifest-path vault-core/Cargo.toml
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t vault-server .
      - name: Check the Oracle deployment file
        run: VAULT_DOMAIN=example.duckdns.org VAULT_INVITE_CODE=ci-check-code docker compose -f deploy/docker-compose.yml config --quiet
