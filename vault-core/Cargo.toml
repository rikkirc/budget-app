[package]
name = "vault-core"
version = "0.2.0"
description = "Vault's business logic, shared by the desktop/mobile app and the sync server"
authors = ["rikkirc"]
edition = "2021"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
