[package]
name = "budget-app"
version = "0.2.0"
description = "Financial Command Center: a desktop budgeting app"
authors = ["rikkirc"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The lib target is what Android and iOS load; the desktop binary in main.rs just calls into it
[lib]
name = "budget_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vault-core = { path = "../vault-core" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
dirs = "6.0"
